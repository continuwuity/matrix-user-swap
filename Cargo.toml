[package]
name = "matrix-user-swap"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

description = "A Matrix account migration tool."
authors = ["Jade Ellis <jade@ellis.link>"]
homepage = "https://forgejo.ellis.link/continuwuation/matrix-user-swap"
repository = "https://github.com/continuwuity/matrix-user-swap"

[package.metadata.wix]
upgrade-guid = "9EC96776-1392-4BF2-8F0F-DCD2DCAAD8FD"
path-guid = "1C68844A-B115-4FD6-A17A-C067CB471523"
license = false
eula = false

# Keep alphabetically sorted
[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
missing_abi = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Groups. Keep alphabetically sorted
pedantic = { level = "warn", priority = -1 }

# Lints. Keep alphabetically sorted
as_conversions = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
negative_feature_names = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
string_to_string = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

[dependencies]
clap = { version = "4.5.21", features = ["derive", "wrap_help"] }
derive_more = { version = "1.0.0", features = ["display"] }
dialoguer = { version = "0.11.0", default-features = false, features = ["password"] }
impl-tools = "0.10.3"
indicatif = "0.18.0"
rand = "0.8.5"
ruma = { version = "0.11.1", default-features = false, features = [ "client", "client-api-c", "client-ext-client-api", "client-reqwest-rustls-native-roots", "rand" ] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.40"
tracing-indicatif = "0.3.13"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
wee-woo = "0.1.0"

[dev-dependencies]
insta = { version = "1.41.1", features = ["glob", "json"] }
serde_json5 = "0.1.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
